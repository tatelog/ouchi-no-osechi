</main><script>
const video=document.querySelector('video'),start=document.querySelector('.start');
start.hidden=false;video.controls=false;
start.onclick=async()=>{
  video.controls=true;video.muted=false;
  try{await video.play()}catch{start.hidden=false;start.textContent='▶ もう一度再生'}
};
video.addEventListener('playing',()=>{start.hidden=true});
video.addEventListener('ended',()=>{video.controls=false;start.textContent='▶ もう一度見る';start.hidden=false});
